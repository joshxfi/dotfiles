id = "joshxfi.keep-awake"
name = "Keep Awake"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Keep the machine awake while any agent is working, a closed Mac lid included."
platforms = ["macos", "linux"]

# Clears a leftover disablesleep if Herdr exited while an agent was working.
[[startup]]
command = ["python3", "keep_awake.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "keep_awake.py"]

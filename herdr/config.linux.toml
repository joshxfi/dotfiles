onboarding = false

[ui]
pane_gaps = false

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+a"
# prefix+/ focuses the sidebar spaces list (NAVIGATE mode).
workspace_picker = "prefix+/"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# panes move to the arrows since j/k now walk workspaces
navigate_pane_up = "up"
navigate_pane_down = "down"
# Alt+j/k walk workspaces, Alt+h/l walk tabs (macOS uses Cmd; Meta belongs to Plasma).
next_workspace = "alt+j"
previous_workspace = "alt+k"
previous_tab = ["prefix+p", "alt+h"]
next_tab = "alt+l"
new_workspace = "prefix+n"
new_worktree = "prefix+w"

[ui.toast]
delivery = "terminal"

[terminal]
# Force zsh for herdr panes regardless of inherited $SHELL.
default_shell = "/usr/bin/zsh"

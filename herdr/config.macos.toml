onboarding = false

[ui]
pane_gaps = false

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+a"
# prefix+/ focuses the sidebar spaces list (NAVIGATE mode).
workspace_picker = "prefix+/"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# panes move to the arrows since j/k now walk workspaces
navigate_pane_up = "up"
navigate_pane_down = "down"
# Cmd+j/k walk workspaces, Cmd+h/l walk tabs (Ghostty sends these as CSI-u).
next_workspace = "cmd+j"
previous_workspace = "cmd+k"
previous_tab = ["prefix+p", "cmd+h"]
next_tab = ["prefix+n", "cmd+l"]

[ui.toast]
delivery = "terminal"
